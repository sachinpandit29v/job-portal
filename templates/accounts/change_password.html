{% extends "base.html" %}

{% block title %}Change Password - Job Portal &amp; ATS{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card p-4 p-md-5 border shadow-sm mx-auto" style="max-width: 480px;">
    
    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 rounded-circle bg-light text-dark mb-2">
        <i class="bi bi-shield-lock fs-4"></i>
      </div>
      <h3 class="fw-extrabold text-dark">Change Password</h3>
      <p class="text-muted small">Update your account security credentials</p>
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label small fw-semibold">Current Password</label>
        <input type="password" name="old_password" required class="form-control" placeholder="••••••••">
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">New Password (Min 6 chars)</label>
        <input type="password" name="new_password" required minlength="6" class="form-control" placeholder="••••••••">
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold">Confirm New Password</label>
        <input type="password" name="confirm_password" required minlength="6" class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
        Update Password
      </button>
    </form>

  </div>
</div>
{% endblock %}
