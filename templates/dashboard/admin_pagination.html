{% if page_obj.paginator.num_pages > 1 %}
<nav class="p-3" aria-label="Pagination">
    <ul class="pagination pagination-sm justify-content-end mb-0">
        {% if page_obj.has_previous %}
            <li class="page-item"><a class="page-link" href="?{% if extra_query %}{{ extra_query }}&{% endif %}{{ page_param }}={{ page_obj.previous_page_number }}">Previous</a></li>
        {% endif %}
        <li class="page-item active"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
        {% if page_obj.has_next %}
            <li class="page-item"><a class="page-link" href="?{% if extra_query %}{{ extra_query }}&{% endif %}{{ page_param }}={{ page_obj.next_page_number }}">Next</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
